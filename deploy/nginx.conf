# Nginx reverse proxy untuk Trading Dashboard
# 1. Simpan sebagai:  /etc/nginx/sites-available/trading-dashboard
# 2. Ganti YOURDOMAIN.com dengan domain Anda
# 3. Aktifkan: sudo ln -s /etc/nginx/sites-available/trading-dashboard /etc/nginx/sites-enabled/
# 4. Test: sudo nginx -t  lalu  sudo systemctl reload nginx

server {
    listen 80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    # gzip biar chart lib & js lebih cepat
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # batasi buffering biar respons JSON realtime terkirim cepat
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # cache file statis (chart library ~160KB) di sisi Nginx
    location /lib/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
